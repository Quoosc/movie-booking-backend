services:
  app:
    build:
      context: .
      target: app
    container_name: movie-booking-backend-app
    env_file:
      - .env.docker
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      RUN_MIGRATIONS: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    networks:
      - movie-booking

  nginx:
    image: nginx:1.27-alpine
    container_name: movie-booking-backend-nginx
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - storage_data:/var/www/html/storage:ro
      - bootstrap_cache:/var/www/html/bootstrap/cache:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - movie-booking

  db:
    image: mysql:8.4
    container_name: movie-booking-backend-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Run Docker Compose with --env-file .env.docker}
      MYSQL_USER: ${DB_USERNAME:?Run Docker Compose with --env-file .env.docker}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run Docker Compose with --env-file .env.docker}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run Docker Compose with --env-file .env.docker}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - movie-booking

  queue:
    build:
      context: .
      target: app
    container_name: movie-booking-backend-queue
    env_file:
      - .env.docker
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      RUN_MIGRATIONS: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
    depends_on:
      db:
        condition: service_healthy
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    volumes:
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    networks:
      - movie-booking

  scheduler:
    build:
      context: .
      target: app
    container_name: movie-booking-backend-scheduler
    env_file:
      - .env.docker
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      RUN_MIGRATIONS: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    networks:
      - movie-booking

volumes:
  db_data:
  storage_data:
  bootstrap_cache:

networks:
  movie-booking:
    driver: bridge
